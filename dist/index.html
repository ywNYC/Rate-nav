const fmt = (n) => n.toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtD = (n) => "$" + fmt(Math.round(n));
const fmtP = (n) => n.toFixed(3) + "%";

function pmtCalc(annualRate, totalMonths, principal) {
  if (annualRate === 0) return principal / totalMonths;
  const r = annualRate / 100 / 12;
  return (principal * r * Math.pow(1 + r, totalMonths)) / (Math.pow(1 + r, totalMonths) - 1);
}

function calcAPR(noteRate, loanAmount, pointCost, totalMonths) {
  if (pointCost <= 0) return noteRate;
  const payment = pmtCalc(noteRate, totalMonths, loanAmount);
  const netProceeds = loanAmount - pointCost;
  let lo = noteRate * 0.5, hi = noteRate * 3;
  for (let i = 0; i < 80; i++) {
    const mid = (lo + hi) / 2;
    const r = mid / 100 / 12;
    const pv = r === 0 ? payment * totalMonths : payment * (1 - Math.pow(1 + r, -totalMonths)) / r;
    if (pv > netProceeds) lo = mid; else hi = mid;
  }
  return Math.round(((lo + hi) / 2) * 1000) / 1000;
}

function RateInput({ label, labelEn, value, onChange, min, max, step, color }) {
  const pct = ((value - min) / (max - min)) * 100;
  const [editing, setEditing] = React.useState(false);
  const [draft, setDraft] = React.useState("");
  const startEdit = () => { setDraft(value.toFixed(3)); setEditing(true); };
  const commitEdit = () => {
    const v = parseFloat(draft);
    if (!isNaN(v) && v >= min && v <= max) onChange(Math.round(v * 1000) / 1000);
    setEditing(false);
  };
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 7 }}>
        <div>
          <span style={{ fontSize: 13, color: C.text, fontWeight: 600 }}>{label}</span>
          {labelEn && <span style={{ fontSize: 10, color: C.textMuted, marginLeft: 6 }}>{labelEn}</span>}
        </div>
        {editing ? (
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <input autoFocus type="number" value={draft} onChange={e => setDraft(e.target.value)}
              onBlur={commitEdit} onKeyDown={e => e.key === "Enter" && commitEdit()}
              style={{ width: 72, fontSize: 15, fontWeight: 700, fontFamily: MONO, color: color || C.arm,
                border: `1.5px solid ${color || C.arm}`, borderRadius: 8, padding: "3px 8px",
                background: C.white, outline: "none", textAlign: "right" }} />
            <span style={{ fontSize: 14, color: color || C.arm, fontWeight: 700 }}>%</span>
          </div>
        ) : (
          <span onClick={startEdit} style={{
            fontSize: 16, color: color || C.arm, fontWeight: 700, fontFamily: MONO, cursor: "pointer",
            padding: "2px 8px", borderRadius: 6, border: `1px dashed ${C.border}`,
          }}>{value.toFixed(3)}%</span>
        )}
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e => onChange(Math.round(Number(e.target.value) * 1000) / 1000)}
        style={{ width: "100%", height: 5, borderRadius: 3, outline: "none",
          appearance: "none", WebkitAppearance: "none", cursor: "pointer",
          background: `linear-gradient(to right, ${color || C.arm} 0%, ${color || C.arm} ${pct}%, ${C.border} ${pct}%, ${C.border} 100%)`,
        }} />
    </div>
  );
}

function AmountSlider({ label, labelEn, value, onChange, min, max, step, color }) {
  const pct = ((value - min) / (max - min)) * 100;
  const [editing, setEditing] = React.useState(false);
  const [draft, setDraft] = React.useState("");
  const startEdit = () => { setDraft(String(value)); setEditing(true); };
  const commitEdit = () => {
    const v = parseInt(draft.replace(/[^0-9]/g, ""), 10);
    if (!isNaN(v) && v >= min && v <= max) onChange(v);
    setEditing(false);
  };
  return (
    <div style={{ marginBottom: 18 }}>

            onBlur={commitEdit} onKeyDown={e => e.key === "Enter" && commitEdit()}

        }} />
    </div>
  );
}

function buildArmMonthly(principal, armQuoteRate, armPoints, fixedPeriod, scenario, periodicCap, lifetimeCap, termYears, seed) {
  const initRate = armQuoteRate;
  let s = seed;
  const rand = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const noise = () => (rand() - 0.5) * 0.03;
  const schedule = []; let balance = principal, currentRate = initRate, totalInterest = 0;
  const totalMonths = termYears * 12, fixedMonths = fixedPeriod * 12;
  for (let m = 1; m <= totalMonths; m++) {
    if (m > fixedMonths && (m - fixedMonths - 1) % 12 === 0) {
      const adjY = Math.floor((m - fixedMonths - 1) / 12), totalAdj = termYears - fixedPeriod, prog = adjY / totalAdj;
      let d = 0;
      switch (scenario) {
        case "sharp_rise": d = 0.35 + rand()*0.15+noise(); break;
        case "mod_rise": d = 0.12+rand()*0.08+noise(); break;
        case "rise_flat": d = adjY<totalAdj*0.4?(0.25+rand()*0.12+noise()):(noise()*1.5); break;
        case "flat": d = (rand()-0.5)*0.06+noise(); break;
        case "v_shape": d = prog<0.45?-(0.18+rand()*0.08+noise()):(0.22+rand()*0.10+noise()); break;
        case "inv_v": d = prog<0.45?(0.22+rand()*0.10+noise()):-(0.18+rand()*0.08+noise()); break;
        case "mod_fall": d = -(0.10+rand()*0.08)+noise(); break;
        case "sharp_fall": d = -(0.28+rand()*0.12)+noise(); break;
        default: d = noise();
      }
      let nr = Math.round((currentRate+d)*100)/100;
      if(nr-currentRate>periodicCap) nr=currentRate+periodicCap;
      if(currentRate-nr>periodicCap) nr=currentRate-periodicCap;
      nr = Math.min(Math.max(nr, initRate), initRate+lifetimeCap);
      currentRate = Math.round(nr*100)/100;
    }
    const rm = totalMonths-m+1, mp = pmtCalc(currentRate,rm,balance);
    const ip = balance*(currentRate/100/12), pp = mp-ip;
    balance = Math.max(0,balance-pp); totalInterest += ip;
    schedule.push({ month:m, rate:currentRate, payment:mp, balance, totalInterest });
  }
  return schedule;
}

function buildFixedMonthly(principal, rate, termYears) {
  const mp = pmtCalc(rate, termYears*12, principal);
  const sch = []; let bal = principal, ti = 0;
  for (let m = 1; m <= termYears*12; m++) {
    const ip = bal*(rate/100/12); bal = Math.max(0,bal-(mp-ip)); ti += ip;
    sch.push({ month:m, rate, payment:mp, balance:bal, totalInterest:ti });
  }
  return sch;
}

function MonthScrubber({ month, maxMonth, onChange, fixedMonths, en: isEn }) {

  },[maxMonth,onChange]);
  const onDown = React.useCallback(e => {
    e.preventDefault(); handle(e.clientX);

    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
  },[handle]);

            <div style={{ display:"flex", flex:1, background:C.cardAlt, borderRadius:12, padding:3 }}>
              {[{key:"rate",l:isEn?"Rates":"利率走势"},{key:"payment",l:isEn?"Payment":"月供对比"},{key:"interest",l:isEn?"Interest":"累计利息"}].map(t=>{const a=t.key===chartMode;return(
                <button key={t.key} onClick={()=>setChartMode(t.key)} style={{ flex:1, padding:"7px 2px", borderRadius:10, border:"none", cursor:"pointer", background:a?C.white:"transparent", boxShadow:a?"0 1px 4px rgba(0,0,0,0.05)":"none", fontFamily:FONT, fontSize:12, fontWeight:a?700:500, color:a?C.arm:C.textDim }}>{t.l}</button>

                <Recharts.YAxis domain={[chartYRange.min, chartYRange.max]} tick={{fontSize:10,fill:C.textMuted}} tickLine={false} axisLine={false} tickFormatter={v=>chartMode==="rate"?v.toFixed(1)+"%":v>=1000?"$"+(v/1000).toFixed(0)+"k":"$"+v}/>

                <Recharts.Area type="monotone" dataKey={ck[1]} stroke={C.fixed} strokeWidth={2} fill="url(#gF)" dot={false}/>
                <Recharts.Area type="monotone" dataKey={ck[0]} stroke={C.arm} strokeWidth={2.5} fill="url(#gA)" dot={false} activeDot={showRefLine?false:{r:4,fill:C.arm,stroke:C.white,strokeWidth:2}}/>
              </Recharts.AreaChart>
            </Recharts.ResponsiveContainer>
            {showRefLine && (() => {
              const armVal = chartMode==="rate"?cur.rate:chartMode==="payment"?cur.payment:cur.totalInterest;
              const fixVal = chartMode==="rate"?curF.rate:chartMode==="payment"?curF.payment:curF.totalInterest;
              const range = chartYRange.max - chartYRange.min || 1;
              let ap = (1 - (armVal - chartYRange.min) / range) * 82 + 4;
              let fp = (1 - (fixVal - chartYRange.min) / range) * 82 + 4;
              ap = Math.max(5, Math.min(78, ap)); fp = Math.max(5, Math.min(78, fp));
              if (Math.abs(ap - fp) < 9) { const mid = (ap + fp) / 2; if (ap < fp) { ap = mid - 5; fp = mid + 5; } else { fp = mid - 5; ap = mid + 5; } }
              const xP = Math.max(12, 11 + ((selectedMonth-1)/359)*82);
              const fl = xP > 65;
              const labelX = fl ? (xP - 1) : Math.max(xP + 1, 14);

              return <div style={{ position:"absolute", top:0, bottom:0, left:0, right:0, pointerEvents:"none" }}>

                <div style={{ position:"absolute", top:ap+"%", left:labelX+"%", transform:fl?"translateX(-100%)":"none", background:C.white+"F0", border:"1px solid "+C.arm, borderRadius:3, padding:"0 4px", fontSize:7, fontWeight:700, color:C.arm, whiteSpace:"nowrap", lineHeight:"12px" }}>{aT}</div>
                <div style={{ position:"absolute", top:fp+"%", left:labelX+"%", transform:fl?"translateX(-100%)":"none", background:C.white+"F0", border:"1px solid "+C.fixed, borderRadius:3, padding:"0 4px", fontSize:7, fontWeight:700, color:C.fixed, whiteSpace:"nowrap", lineHeight:"12px" }}>{fT}</div>
              </div>;
            })()}
          </div>
          <div style={{ display:"flex", justifyContent:"center", gap:24, padding:"4px 0 2px" }}>
            {[{c:C.arm,l:"ARM"},{c:C.fixed,l:isEn?"30yr Fixed":"30年固定"}].map(x=><div key={x.l} style={{ display:"flex", alignItems:"center", gap:6 }}><div style={{ width:14, height:3, borderRadius:2, background:x.c }}/><span style={{ fontSize:11, color:C.textDim }}>{x.l}</span></div>)}
          </div>
          <div style={{ margin:"4px 10px 0", padding:"8px 12px", background:C.cardAlt, borderRadius:10 }}>
            <MonthScrubber month={selectedMonth} maxMonth={totalMonths} onChange={setSelectedMonth} fixedMonths={fixedMonths} en={isEn} />
          </div>
        </div>
      </div>

      {/* Total Cost */}
      <div style={{ padding:"8px 16px 0" }}>
        <div style={{ background:C.card, border:`1px solid ${C.borderLight}`, borderRadius:18, padding:18, boxShadow:C.shadow }}>
          <div style={{ fontSize:13, fontWeight:700, marginBottom:14 }}>{isEn?"Total Cost ":"累计总成本 "}<span style={{ fontSize:10, color:C.textMuted, fontWeight:400 }}>{`Y${yr} M${mo}`}</span></div>
          <div style={{ display:"flex", gap:14 }}>
            {[{l:"ARM",v:armTC,iv:cur.totalInterest,p:armPointCost,c:C.arm},{l:isEn?"Fixed":"固定",v:fixTC,iv:curF.totalInterest,p:fixedPointCost,c:C.fixed}].map(x=>{const mx=Math.max(armTC,fixTC);return(
              <div key={x.l} style={{ flex:1 }}><div style={{ fontSize:11, color:x.c, fontWeight:600, marginBottom:6 }}>{x.l}</div>

              <div style={{ fontSize:16, fontWeight:700, color:x.c, fontFamily:MONO, marginTop:6 }}>{fmtD(x.v)}</div>
              <div style={{ fontSize:9, color:C.textMuted, marginTop:2 }}>{isEn?"Int ":"利息"}{fmtD(x.iv)}{x.p>0?` + ${isEn?"pts ":"买点"}${fmtD(x.p)}`:""}</div></div>
            );})}
          </div>
          <div style={{ marginTop:12, padding:"10px 14px", borderRadius:12, background:tcDiff>0?C.dangerLight:C.armLight, fontSize:13, fontWeight:600, textAlign:"center", color:tcDiff>0?C.danger:C.arm }}>
            {tcDiff>0?`⚠️ ${isEn?"ARM costs more ":"ARM总成本多 "}${fmtD(tcDiff)}`:`✅ ${isEn?"ARM saves ":"ARM总成本省 "}${fmtD(Math.abs(tcDiff))}`}<span style={{ fontSize:10, fontWeight:400, opacity:0.7 }}>{isEn?" (incl. points)":"（含买点）"}</span>
          </div>
        </div>
      </div>

      <div style={{ padding:"8px 16px 0" }}><GlossarySection terms={ARM_GLOSSARY} en={isEn} /></div>
      <BrandingFooter />

      {/* Bottom Bar */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, background:`linear-gradient(180deg,transparent 0%,${C.bg} 35%)`, paddingTop:16 }}>
        <div style={{ background:`${C.white}F5`, borderTop:`1px solid ${C.border}`, padding:"10px 16px 14px", display:"flex", alignItems:"center", boxShadow:"0 -4px 20px rgba(30,60,30,0.05)", backdropFilter:"blur(12px)" }}>
          {[{l:isEn?"ARM":"ARM月供",v:fmtD(cur.payment),c:C.arm},null,{l:isEn?"Fixed":"固定月供",v:fmtD(curF.payment),c:C.fixed},null,{l:isEn?"Diff":"差额",v:(diff>=0?"+":"")+fmtD(diff),c:diff>0?C.danger:C.arm}].map((item,i)=>{
            if(!item) return <div key={i} style={{ width:1, height:28, background:C.border }}/>;
            return <div key={i} style={{ flex:1, textAlign:"center" }}><div style={{ fontSize:9, color:C.textMuted, fontWeight:600, letterSpacing:0.5, marginBottom:2 }}>{item.l}</div><div style={{ fontSize:16, fontWeight:700, fontFamily:MONO, color:item.c }}>{item.v}</div></div>;
          })}
        </div>
      </div>
    </div>
  );
}

        <div style={{ textAlign:"center", padding:"20px 16px", background:"linear-gradient(135deg,"+C.armLight+","+C.fixedLight+")", borderRadius:14, marginBottom:12 }}>

          <div style={{ fontSize:36, fontWeight:700, fontFamily:MONO, color:C.arm, margin:"4px 0" }}>{fmtD(totalMonthly)}</div>
          <div style={{ fontSize:10, color:C.textMuted }}>{fmtD(homePrice)} · {downPct}% down · {rate}% · {propTypeLabel(propType)} · {state}</div>
        </div>
        <div style={{ background:C.cardAlt, borderRadius:12, padding:"10px 12px", marginBottom:10 }}>
          <div style={{ fontSize:10, fontWeight:700, color:C.textDim, marginBottom:6 }}>{isEn?"BREAKDOWN":"构成明细"}</div>
          {breakdown.map((b,i) => <div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"4px 0", borderBottom:i<breakdown.length-1?"1px solid "+C.borderLight:"none" }}><span style={{ fontSize:11, color:C.textSec }}>{b.label}</span><span style={{ fontSize:12, fontWeight:600, fontFamily:MONO, color:b.color }}>{fmtD(b.value)}</span></div>)}
          <div style={{ display:"flex", justifyContent:"space-between", padding:"6px 0 0", borderTop:"2px solid "+C.arm, marginTop:4 }}><span style={{ fontSize:12, fontWeight:700 }}>{isEn?"Total":"总计"}</span><span style={{ fontSize:14, fontWeight:700, fontFamily:MONO, color:C.arm }}>{fmtD(totalMonthly)}</span></div>
        </div>
        <div style={{ display:"flex", gap:8, marginBottom:12 }}>
          <div style={{ flex:1, padding:10, background:C.fixedLight, borderRadius:10, textAlign:"center" }}>
            <div style={{ fontSize:9, color:C.fixed, fontWeight:600 }}>{isEn?"CASH TO CLOSE":"过户现金"}</div>
            <div style={{ fontSize:15, fontWeight:700, fontFamily:MONO, color:C.fixed }}>{fmtD(cashToClose)}</div>
            <div style={{ fontSize:8, color:C.textMuted }}>{isEn?"down + ~3%":"首付+约3%"}</div>
          </div>
          <div style={{ flex:1, padding:10, background:C.purpleLight, borderRadius:10, textAlign:"center" }}>
            <div style={{ fontSize:9, color:C.purple, fontWeight:600 }}>{isEn?"INCOME (PRE-TAX)":"所需年收入(税前)"}</div>
            <div style={{ fontSize:15, fontWeight:700, fontFamily:MONO, color:C.purple }}>{fmtD(incomeNeeded)}</div>
            <div style={{ fontSize:8, color:C.textMuted }}>{isEn?"/yr pre-tax · 28%":"/年税前 · 28%"}</div>
          </div>
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", borderTop:"1px solid "+C.border, paddingTop:8 }}>
          <span style={{ fontSize:8, color:C.textMuted }}>Product by JMJ</span>
          <button onClick={() => navigator.clipboard && navigator.clipboard.writeText(txt)} style={{ padding:"3px 10px", borderRadius:6, border:"1px solid "+C.arm, cursor:"pointer", background:C.armLight, color:C.arm, fontSize:9, fontWeight:600, fontFamily:FONT }}>{isEn?"Copy":"复制"}</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily:FONT, background:C.bg, minHeight:"100vh", color:C.text, maxWidth:480, margin:"0 auto", paddingTop:56, paddingBottom:32 }}>
      <GlobalStyles />
      <div style={{ position:"fixed", top:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, zIndex:100, background:"rgba(255,255,255,0.15)", backdropFilter:"blur(22px) saturate(1.4)", WebkitBackdropFilter:"blur(22px) saturate(1.4)", borderBottom:"1px solid rgba(255,255,255,0.3)", boxShadow:"0 1px 12px rgba(30,60,30,0.04)" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 16px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <button onClick={onBack} style={{ background:C.cardAlt, border:"none", borderRadius:8, padding:"5px 8px", cursor:"pointer", fontSize:14, color:C.textSec }}>{"\u2190"}</button>
            <LogoSVG size={24} />
            <div>
              <div style={{ fontSize:14, fontWeight:700 }}>{isEn?"Mortgage Estimator":"月供估算"}</div>
              <div style={{ fontSize:9, color:C.textMuted }}>PAYMENT ESTIMATOR by JMJ</div>
            </div>
          </div>
          <div style={{ display:"flex", gap:3 }}>
            <button onClick={() => setShowReport(true)} style={{ background:C.arm, border:"none", borderRadius:8, padding:"5px 10px", cursor:"pointer", fontSize:11, color:C.white, fontFamily:FONT, fontWeight:600 }}>{"\u{1F4CB}"}</button>
            <button onClick={() => { setHomePrice(700000); setDownPct(20); setRate(6.75); setPropType("sfh"); setState("NY"); setLocationPreset("state_avg"); setCustomTaxRate(null); setCreditScore("740"); setHoaOverride(null); setInsOverride(null); }} style={{ background:C.cardAlt, border:"1px solid "+C.border, borderRadius:8, padding:"5px 8px", cursor:"pointer", fontSize:10, color:C.textSec, fontFamily:FONT, fontWeight:600 }}>{"\u{1F504}"}</button>
          </div>
        </div>
      </div>

      {/* Sticky compact floating payment display - fully transparent w/ blur */}
      <div style={{ position:"sticky", top:44, zIndex:50, padding:"8px 16px 6px", background:"transparent", backdropFilter:"blur(24px) saturate(1.4)", WebkitBackdropFilter:"blur(24px) saturate(1.4)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 14px", background:"rgba(255,255,255,0.28)", backdropFilter:"blur(20px) saturate(1.3)", WebkitBackdropFilter:"blur(20px) saturate(1.3)", borderRadius:14, border:"1px solid rgba(255,255,255,0.4)", boxShadow:"0 4px 24px rgba(30,60,30,0.06)" }}>
          <div style={{ flexShrink:0 }}>
            <div style={{ fontSize:8, color:C.textDim, fontWeight:600, letterSpacing:0.8 }}>{isEn?"MONTHLY":"月供"}</div>
            <div style={{ fontSize:22, fontWeight:700, fontFamily:MONO, color:C.arm, letterSpacing:-0.5, lineHeight:1 }}>{fmtD(totalMonthly)}</div>
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:"flex", height:4, borderRadius:2, overflow:"hidden", marginBottom:3 }}>
              {breakdown.map((b,i) => <div key={i} style={{ flex:b.value, background:b.color }} title={b.label} />)}
            </div>
            <div style={{ fontSize:9, color:C.textMuted, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{propTypeLabel(propType)} · {state} · {downPct}% {isEn?"down":"首付"}{pmiApplies ? " · "+(isEn?"PMI":"PMI") : ""}</div>
          </div>
        </div>
      </div>

      {/* Inputs */}
      <div style={{ padding:"8px 16px 0" }}>
        <div style={{ background:C.white, borderRadius:14, padding:14, marginBottom:10, boxShadow:C.shadow }}>
          <AmountSlider label={isEn?"Home Price":"房价"} value={homePrice} onChange={setHomePrice} min={100000} max={3000000} step={25000} color={C.arm} />
          <div style={{ marginBottom:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
              <span style={{ fontSize:11, color:C.textDim }}>{isEn?"Down Payment":"首付比例"}{downPct < 20 && <span style={{ fontSize:9, color:C.warn, fontWeight:700, marginLeft:6, padding:"1px 6px", background:C.warnLight, borderRadius:4 }}>{isEn?"\u26A0 PMI":"\u26A0 需PMI"}</span>}</span>
              <span style={{ fontSize:12, fontWeight:700, fontFamily:MONO }}>{downPct}% ({fmtD(downAmount)})</span>
            </div>
            <input type="range" min={3} max={50} step={1} value={downPct} onChange={e => setDownPct(Number(e.target.value))}
              style={{ width:"100%", height:5, borderRadius:3, outline:"none", appearance:"none", WebkitAppearance:"none", cursor:"pointer", background:`linear-gradient(to right,${C.arm} 0%,${C.arm} ${((downPct-3)/47)*100}%,${C.border} ${((downPct-3)/47)*100}%,${C.border} 100%)` }} />
            {downPct < 20 && <div style={{ fontSize:9, color:C.warn, marginTop:3, fontWeight:500 }}>{isEn?`LTV ${ltv.toFixed(1)}% > 80%, lender requires PMI until balance reaches 78% of price`:`LTV ${ltv.toFixed(1)}% > 80%，银行要求缴PMI直到余额降至房价的78%`}</div>}
          </div>
          <div style={{ marginBottom:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
              <span style={{ fontSize:11, color:C.textDim }}>{isEn?"Interest Rate":"利率"}</span>
              <span style={{ fontSize:12, fontWeight:700, fontFamily:MONO }}>{rate.toFixed(3)}%</span>
            </div>
            <input type="range" min={3} max={10} step={0.125} value={rate} onChange={e => setRate(Number(e.target.value))}
              style={{ width:"100%", height:5, borderRadius:3, outline:"none", appearance:"none", WebkitAppearance:"none", cursor:"pointer", background:`linear-gradient(to right,${C.fixed} 0%,${C.fixed} ${((rate-3)/7)*100}%,${C.border} ${((rate-3)/7)*100}%,${C.border} 100%)` }} />
          </div>
          <div style={{ marginBottom:10 }}>
            <div style={{ fontSize:11, color:C.textDim, fontWeight:600, marginBottom:4 }}>{isEn?"Loan Term":"贷款期限"}</div>
            <div style={{ display:"flex", gap:4, background:C.cardAlt, borderRadius:10, padding:2 }}>
              {[15,20,30].map(y => { const a=y===termYears; return <button key={y} onClick={() => setTermYears(y)} style={{ flex:1, padding:"7px 2px", borderRadius:8, border:"none", cursor:"pointer", background:a?C.white:"transparent", boxShadow:a?C.shadow:"none", fontSize:12, fontWeight:a?700:500, color:a?C.arm:C.textDim, fontFamily:FONT }}>{y}{isEn?"yr":"年"}</button>; })}
            </div>
          </div>
        </div>

        {/* Property Type */}
        <div style={{ background:C.white, borderRadius:14, padding:14, marginBottom:10, boxShadow:C.shadow }}>
          <div style={{ fontSize:11, color:C.textDim, fontWeight:600, marginBottom:6 }}>{isEn?"Property Type":"房屋类型"}</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6 }}>
            {[
              {k:"sfh", l:isEn?"\u{1F3E0} Single Family":"\u{1F3E0} 独立屋", sub:isEn?"Tax + Insurance":"地税 + 保险"},
              {k:"condo", l:"\u{1F3E2} Condo", sub:isEn?"Tax + HOA + HO-6":"地税 + HOA + HO-6"},
              {k:"coop", l:"\u{1F3EC} Co-op", sub:isEn?"Maint. (incl. tax)":"管理费(含税)"},
              {k:"townhouse", l:isEn?"\u{1F3D8} Townhouse":"\u{1F3D8} 联排屋", sub:isEn?"Tax + small HOA":"地税 + 小HOA"},
            ].map(t => { const a=t.k===propType; return <button key={t.k} onClick={() => { setPropType(t.k); setHoaOverride(null); }} style={{ padding:"8px 6px", borderRadius:10, border:a?"2px solid "+C.arm:"1px solid "+C.border, cursor:"pointer", background:a?C.armLight:C.white, textAlign:"left" }}>
              <div style={{ fontSize:12, fontWeight:700, color:a?C.arm:C.text }}>{t.l}</div>
              <div style={{ fontSize:9, color:C.textMuted, marginTop:2 }}>{t.sub}</div>
            </button>; })}
          </div>
        </div>

        {/* Location + Credit */}
        <div style={{ background:C.white, borderRadius:14, padding:14, marginBottom:10, boxShadow:C.shadow }}>
          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:11, color:C.textDim, fontWeight:600, marginBottom:4 }}>{isEn?"State":"所在州"}{propType==="coop" && <span style={{ fontSize:9, color:C.textMuted, fontWeight:500 }}> · {isEn?"(insurance only)":"(仅用于保险)"}</span>}</div>
              <select value={state} onChange={e => { setState(e.target.value); setLocationPreset("state_avg"); setCustomTaxRate(null); setInsOverride(null); }} style={{ width:"100%", padding:"8px 6px", borderRadius:8, border:"1px solid "+C.border, fontSize:12, fontFamily:FONT, background:C.white, outline:"none" }}>
                {Object.keys(STATE_PROP_TAX).sort().map(k => <option key={k} value={k}>{k} · {STATE_PROP_TAX[k]}%</option>)}
              </select>
              {propType === "coop" ? <div style={{ fontSize:9, color:C.textMuted, marginTop:3, fontStyle:"italic" }}>{isEn?`Co-op: tax bundled in maintenance. State only affects insurance ($${fmtD(stateIns)}/yr)`:`Co-op: 地税含在管理费中。州仅影响保险 ($${fmtD(stateIns)}/年)`}</div> : <div style={{ fontSize:9, color:C.textMuted, marginTop:3 }}>{isEn?`State avg tax: ${stateTaxRate}% · Ins: ${fmtD(stateIns)}/yr`:`州平均地税: ${stateTaxRate}% · 保险: ${fmtD(stateIns)}/年`}</div>}
            </div>
            {pmiApplies && <div style={{ flex:1 }}>
              <div style={{ fontSize:11, color:C.textDim, fontWeight:600, marginBottom:4 }}>{isEn?"Credit (FICO)":"信用评分"}</div>
              <select value={creditScore} onChange={e => setCreditScore(e.target.value)} style={{ width:"100%", padding:"8px 6px", borderRadius:8, border:"1px solid "+C.border, fontSize:12, fontFamily:FONT, background:C.white, outline:"none" }}>
                <option value="760">760+ ({isEn?"Excellent":"优秀"})</option>
                <option value="740">740-759</option>
                <option value="720">720-739</option>
                <option value="700">700-719</option>
                <option value="680">680-699</option>
                <option value="660">660-679</option>
                <option value="640">640-659</option>
                <option value="620">620-639</option>
              </select>
              <div style={{ fontSize:9, color:C.warn, marginTop:3, fontWeight:600 }}>{isEn?`PMI ${pmiRateAnnual}% (LTV ${ltv.toFixed(1)}%)`:`PMI ${pmiRateAnnual}% (LTV ${ltv.toFixed(1)}%)`}</div>
            </div>}
          </div>
          {/* Location preset - KEY DIFFERENTIATION from Zillow: state-specific markets */}
          {propType !== "coop" && <div>
            <div style={{ fontSize:11, color:C.textDim, fontWeight:600, marginBottom:6 }}>{isEn?`Local Tax (${state})`:`本地税率（${state}）`} <span style={{ fontSize:9, color:C.textMuted, fontWeight:500 }}>{isEn?"(assessed often \u2260 market)":"(评估价\u2260市场价)"}</span></div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:4, marginBottom:4 }}>
              {displayPresets.map(p => { const a=p.k===locationPreset; return <button key={p.k} onClick={() => { setLocationPreset(p.k); if (p.k !== "custom") setCustomTaxRate(null); }} style={{ padding:"5px 2px", borderRadius:6, border:a?"1.5px solid "+C.fixed:"1px solid "+C.border, cursor:"pointer", background:a?C.fixedLight:C.white, fontSize:9, fontWeight:a?700:500, color:a?C.fixed:C.textDim, fontFamily:FONT, lineHeight:1.2 }}>{p.l}</button>; })}
            </div>
            <div style={{ fontSize:9, color:C.fixed, marginTop:4, fontWeight:600 }}>{effectiveTaxRate.toFixed(2)}% · {fmtD(Math.round(homePrice*effectiveTaxRate/100/12))}/mo</div>
            <div style={{ fontSize:8, color:currentPreset.note && currentPreset.note.startsWith("⚠")?C.warn:C.textMuted, marginTop:2, lineHeight:1.4, fontStyle:"italic", fontWeight:currentPreset.note && currentPreset.note.startsWith("⚠")?600:400 }}>{currentPreset.note}</div>
            {stateSpecificPresets.length === 0 && <div style={{ fontSize:8, color:C.textMuted, marginTop:4, padding:"4px 8px", background:C.cardAlt, borderRadius:6, fontStyle:"italic" }}>{isEn?`No city-level presets for ${state} yet. Use state average or enter your actual tax rate below.`:`${state}暂无市级预设。使用州平均或下方输入实际税率。`}</div>}
          </div>}
        </div>

        {/* Monthly Breakdown */}
        <div style={{ background:C.white, borderRadius:14, padding:14, marginBottom:10, boxShadow:C.shadow }}>
          <div style={{ fontSize:12, color:C.text, fontWeight:700, marginBottom:10 }}>{isEn?"Monthly Breakdown":"月供构成"}</div>
          {breakdown.map((b,i) => (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 0", borderBottom:i<breakdown.length-1?"1px solid "+C.borderLight:"none" }}>
              <div style={{ width:8, height:8, borderRadius:4, background:b.color, flexShrink:0 }} />
              <div style={{ flex:1 }}>
                <div style={{ fontSize:12, fontWeight:600, color:C.textSec }}>{b.label}</div>
                {b.key==="pmi" && <div style={{ fontSize:9, color:C.textMuted }}>{pmiRateAnnual}% /yr · FICO {creditScore}+</div>}
                {b.key==="tax" && <div style={{ fontSize:9, color:C.textMuted }}>{effectiveTaxRate.toFixed(2)}% · {currentPreset.l}</div>}
                {b.key==="ins" && <div style={{ fontSize:9, color:C.textMuted }}>{propType==="condo"||propType==="coop"?"HO-6":"HO-3"}</div>}
              </div>
              <div style={{ fontSize:14, fontWeight:700, fontFamily:MONO, color:b.color }}>{fmtD(b.value)}</div>
            </div>
          ))}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0 0", borderTop:"2px solid "+C.arm, marginTop:6 }}>
            <div style={{ fontSize:13, fontWeight:700 }}>{isEn?"Total Monthly":"月供总计"}</div>
            <div style={{ fontSize:18, fontWeight:700, fontFamily:MONO, color:C.arm }}>{fmtD(totalMonthly)}</div>
          </div>
        </div>

        {/* Advanced overrides */}
        <div style={{ background:C.cardAlt, borderRadius:14, padding:14, marginBottom:10 }}>
          <div style={{ fontSize:11, color:C.textDim, fontWeight:700, marginBottom:8 }}>{isEn?"\u{1F527} Fine-tune (optional)":"\u{1F527} 精细调整（可选）"}</div>
          {propType !== "coop" && <div style={{ marginBottom:8 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
              <span style={{ fontSize:10, color:C.textSec }}>{isEn?"Effective Tax Rate":"有效地税率"} <span style={{ fontSize:8, color:C.textMuted }}>{isEn?"(on market value)":"(基于市场价)"}</span></span>
              <span style={{ fontSize:11, fontFamily:MONO, fontWeight:600 }}>{effectiveTaxRate.toFixed(2)}% = {fmtD(taxMonthly)}/mo</span>
            </div>
            <input type="range" min={0.2} max={3.0} step={0.05} value={effectiveTaxRate} onChange={e => { setCustomTaxRate(Number(e.target.value)); setLocationPreset("custom"); }}
              style={{ width:"100%", height:4, borderRadius:2, outline:"none", appearance:"none", WebkitAppearance:"none", cursor:"pointer", background:`linear-gradient(to right,${C.fixed} 0%,${C.fixed} ${((effectiveTaxRate-0.2)/2.8)*100}%,${C.border} ${((effectiveTaxRate-0.2)/2.8)*100}%,${C.border} 100%)` }} />
            <div style={{ fontSize:8, color:C.textMuted, marginTop:3, lineHeight:1.4 }}>{isEn?"Tip: This is EFFECTIVE rate (tax ÷ market value). Due to assessment caps/ratios, actual rate is often far from nominal rate. Check your local tax bill.":"提示：这是有效税率（地税÷市场价）。由于评估比例和封顶，实际税率通常与名义税率差很远。查你的实际税单最准。"}</div>
          </div>}
          <div style={{ marginBottom:8 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
              <span style={{ fontSize:10, color:C.textSec }}>{isEn?"Insurance /mo":"保险 /月"}</span>
              <span style={{ fontSize:11, fontFamily:MONO, fontWeight:600 }}>{fmtD(insMonthly)}{insOverride===null?<span style={{ fontSize:8, color:C.textMuted }}>{isEn?" (auto)":" (自动)"}</span>:null}</span>
            </div>
            <input type="range" min={0} max={500} step={10} value={insMonthly} onChange={e => setInsOverride(Number(e.target.value))}
              style={{ width:"100%", height:4, borderRadius:2, outline:"none", appearance:"none", WebkitAppearance:"none", cursor:"pointer", background:`linear-gradient(to right,${C.purple} 0%,${C.purple} ${(insMonthly/500)*100}%,${C.border} ${(insMonthly/500)*100}%,${C.border} 100%)` }} />
          </div>
          {propType !== "sfh" || hoaMonthly > 0 ? <div style={{ marginBottom:4 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
              <span style={{ fontSize:10, color:C.textSec }}>{isEn?(propType==="coop"?"Maintenance /mo":"HOA /mo"):(propType==="coop"?"管理费 /月":"HOA /月")}</span>
              <span style={{ fontSize:11, fontFamily:MONO, fontWeight:600 }}>{fmtD(hoaMonthly)}{hoaOverride===null?<span style={{ fontSize:8, color:C.textMuted }}>{isEn?" (est.)":" (估)"}</span>:null}</span>
            </div>
            <input type="range" min={0} max={propType==="coop"?5000:2500} step={25} value={hoaMonthly} onChange={e => setHoaOverride(Number(e.target.value))}
              style={{ width:"100%", height:4, borderRadius:2, outline:"none", appearance:"none", WebkitAppearance:"none", cursor:"pointer", background:`linear-gradient(to right,${C.danger} 0%,${C.danger} ${(hoaMonthly/(propType==="coop"?5000:2500))*100}%,${C.border} ${(hoaMonthly/(propType==="coop"?5000:2500))*100}%,${C.border} 100%)` }} />
          </div> : null}
        </div>

        {/* Cash to close + Income */}
        <div style={{ display:"flex", gap:8, marginBottom:14 }}>
          <div style={{ flex:1, padding:12, background:C.fixedLight, borderRadius:12, textAlign:"center" }}>
            <div style={{ fontSize:9, color:C.fixed, fontWeight:700, letterSpacing:0.5 }}>{isEn?"CASH TO CLOSE":"过户现金"}</div>
            <div style={{ fontSize:18, fontWeight:700, fontFamily:MONO, color:C.fixed, margin:"4px 0" }}>{fmtD(cashToClose)}</div>
            <div style={{ fontSize:9, color:C.textMuted }}>{fmtD(downAmount)} + ~{fmtD(closingCost)}</div>
          </div>
          <div style={{ flex:1, padding:12, background:C.purpleLight, borderRadius:12, textAlign:"center" }}>
            <div style={{ fontSize:9, color:C.purple, fontWeight:700, letterSpacing:0.5 }}>{isEn?"INCOME (PRE-TAX)":"所需年收入(税前)"}</div>
            <div style={{ fontSize:18, fontWeight:700, fontFamily:MONO, color:C.purple, margin:"4px 0" }}>{fmtD(incomeNeeded)}</div>
            <div style={{ fontSize:9, color:C.textMuted }}>{isEn?"/yr pre-tax · 28%":"/年税前 · 28%"}</div>
          </div>
        </div>

        <GlossarySection terms={MORTGAGE_GLOSSARY} en={isEn} />
      </div>
      <BrandingFooter />
    </div>
  );
}


const POINTS_GLOSSARY = [
  { term:"Discount Points", cn:"买点/折扣点数", desc:"过户时预付的费用，用于换取更低利率。1点=贷款额的1%，通常可降低利率约0.25%。本质是\"预付利息\"。", descEn:"Upfront fee to buy a lower rate. 1 point = 1% of loan amount, typically reduces rate by ~0.25%." },
  { term:"APR", cn:"年化实际利率", desc:"将买点费用分摊到整个贷款期限后的等效年利率。APR越接近票面利率，说明前期费用越低。", descEn:"Effective annual rate after amortizing point costs. The closer APR is to note rate, the lower the upfront costs." },
  { term:"Break-Even", cn:"回本时间", desc:"买点的前期费用通过月供节省回收所需的时间。如果计划在回本前卖房或再融资，买点不划算。", descEn:"Time for monthly savings to recoup point costs. If you sell/refi before break-even, buying points is not worth it." },
  { term:"Note Rate", cn:"票面利率", desc:"贷款合同上的利率，用来计算月供。买了点后这个利率就是降低后的利率。", descEn:"The contract interest rate used to calculate your monthly payment. After buying points, this is the reduced rate." },
  { term:"Base Rate", cn:"基础利率(Par Rate)", desc:"不买任何点数时的原始利率。", descEn:"The original rate with zero discount points (par rate)." },
  { term:"Total Cost", cn:"总成本", desc:"累计利息 + 买点预付费用 + PMI（如适用）。用来对比不同方案的真实总花费。", descEn:"Cumulative interest + upfront point costs + PMI if applicable. The true total expense for comparing options." },
  { term:"PMI", cn:"私人抵押贷款保险", desc:"当首付<20%（LTV>80%）时，传统贷款要求缴纳的保险费，保护贷款机构。年费率0.19%-1.86%不等，取决于信用评分和LTV。月付金额=贷款额×PMI率÷12。根据HPA法案，当贷款余额降至原房价的78%时自动取消，80%时可申请取消。", descEn:"Private Mortgage Insurance. Required on conventional loans when down payment < 20% (LTV > 80%). Annual rate 0.19%-1.86% based on FICO and LTV. Monthly = loan × rate ÷ 12. Per HPA, auto-cancels at 78% LTV of original value; borrower can request cancel at 80% LTV." },
  { term:"LTV", cn:"贷款价值比", desc:"贷款余额÷房价的比例。80%以下无需PMI。LTV越低，月供风险越低，贷款条件越优。", descEn:"Loan-to-Value ratio = loan balance ÷ home value. No PMI needed below 80%. Lower LTV = better terms and no mortgage insurance required." },
];


function PointsAnalyzer({ onBack, lang }) {
  const isEn = lang === "en";
  const [loanMode, setLoanMode] = React.useState("price");
  const [homePrice, setHomePrice] = React.useState(700000);
  const [downPct, setDownPct] = React.useState(20);
  const [directLoan, setDirectLoan] = React.useState(500000);
  const loanAmount = loanMode === "price" ? Math.round(homePrice * (1 - downPct / 100)) : directLoan;
  const [termYears, setTermYears] = React.useState(30);
  const [selectedMonth, setSelectedMonth] = React.useState(60);
  const [rateOptions, setRateOptions] = React.useState([
    { id: 1, rate: 7.000, points: 0 },
    { id: 2, rate: 6.750, points: 0.5 },
  ]);
  const [creditScore, setCreditScore] = React.useState("740");
  const [showReport, setShowReport] = React.useState(false);
  const [reportLang, setReportLang] = React.useState(lang);
  const [minWarn, setMinWarn] = React.useState(false);
  const nextId = React.useRef(10);
  const totalMonths = termYears * 12;

  // PMI Logic: only applies when LTV > 80% (price mode, downPct < 20)
  const initLTV = loanMode === "price" ? (loanAmount / homePrice) * 100 : 0;
  const pmiApplies = loanMode === "price" && initLTV > 80;
  // MGIC-style PMI rate table: [LTV bucket][credit bucket]
  const PMI_RATES = {
    "760":{"97":0.55,"95":0.41,"90":0.30,"85":0.19},
    "740":{"97":0.73,"95":0.58,"90":0.41,"85":0.27},
    "720":{"97":0.85,"95":0.70,"90":0.50,"85":0.35},
    "700":{"97":1.05,"95":0.85,"90":0.65,"85":0.45},
    "680":{"97":1.25,"95":1.05,"90":0.85,"85":0.60},
    "660":{"97":1.55,"95":1.35,"90":1.10,"85":0.80},
    "640":{"97":1.80,"95":1.55,"90":1.30,"85":1.00},
    "620":{"97":1.86,"95":1.65,"90":1.45,"85":1.15},
  };
  const ltvBucket = initLTV > 95 ? "97" : initLTV > 90 ? "95" : initLTV > 85 ? "90" : "85";
  const pmiRateAnnual = pmiApplies ? (PMI_RATES[creditScore]?.[ltvBucket] || 0.73) : 0;
  const pmiCancelBalance = loanMode === "price" ? homePrice * 0.78 : 0; // HPA auto-cancel at 78% LTV

  const removeOption = (id) => {
    if (rateOptions.length <= 2) { setMinWarn(true); setTimeout(() => setMinWarn(false), 2000); return; }
    setRateOptions(rateOptions.filter(o => o.id !== id));
  };
  const addOption = () => {
    if (rateOptions.length >= 7) return;
    const last = rateOptions[rateOptions.length - 1];
    nextId.current++;
    setRateOptions([...rateOptions, { id: nextId.current, rate: Math.max(Math.round((last.rate - 0.25) * 1000) / 1000, 2), points: Math.round((last.points + 0.5) * 1000) / 1000 }]);
  };
  const updateOption = (id, field, val) => setRateOptions(rateOptions.map(o => o.id === id ? { ...o, [field]: val } : o));

  const scenarios = React.useMemo(() => {
    const sorted = [...rateOptions].sort((a, b) => a.points - b.points);
    const base = sorted.find(o => o.points === 0) || sorted[0];
    const basePmt = pmtCalc(base.rate, totalMonths, loanAmount);
    return sorted.map((opt, idx) => {
      const cost = opt.points * 0.01 * loanAmount;
      const pmt = pmtCalc(opt.rate, totalMonths, loanAmount);
      const apr = calcAPR(opt.rate, loanAmount, cost, totalMonths);
      const monthlyPMI = pmiApplies ? (loanAmount * pmiRateAnnual / 100 / 12) : 0;
      const monthly = []; let bal = loanAmount, ti = 0, tpmi = 0, pmiOff = 0;
      for (let m = 1; m <= totalMonths; m++) {
        const ip = bal * (opt.rate / 100 / 12);
        bal = Math.max(0, bal - (pmt - ip));
        ti += ip;
        // PMI applies until scheduled balance drops to 78% of home price
        const pmiActive = pmiApplies && bal > pmiCancelBalance;
        if (pmiActive) { tpmi += monthlyPMI; }
        else if (pmiOff === 0 && pmiApplies) { pmiOff = m; }
        monthly.push({ totalInterest: ti, balance: bal, totalPMI: tpmi, pmiActive: pmiActive });
      }
      if (pmiApplies && pmiOff === 0) pmiOff = totalMonths; // never cancelled within term
      const save = basePmt - pmt;
      const beM = (save > 0 && cost > 0) ? Math.ceil(cost / save) : null;
      const isBase = opt.id === base.id;
      return {
        id: opt.id, points: opt.points, noteRate: opt.rate, pointCost: cost, payment: pmt, apr: apr,
        monthlyPMI: monthlyPMI, pmiOffMonth: pmiOff, pmiOffYears: pmiOff ? (pmiOff / 12).toFixed(1) : null,
        monthlySaving: save, breakEvenMonths: beM, breakEvenYears: beM ? (beM / 12).toFixed(1) : null,
        monthly: monthly, color: isBase ? C.danger : PT_COLORS[idx % PT_COLORS.length],
        label: isBase ? (fmtP(opt.rate) + " / 0" + (isEn ? "pt" : "\u70B9")) : (fmtP(opt.rate) + " / " + opt.points + (isEn ? "pt" : "\u70B9")),
      };
    });
  }, [rateOptions, loanAmount, termYears, isEn, pmiApplies, pmiRateAnnual, pmiCancelBalance]);

  const curMonth = Math.min(selectedMonth, totalMonths);
  const holdYrs = curMonth / 12;
  const holdLabel = holdYrs % 1 === 0 ? (holdYrs + (isEn ? "yr" : "\u5E74")) : (holdYrs.toFixed(1) + (isEn ? "yr" : "\u5E74"));

  const bestAtMonth = scenarios.reduce((best, s) => {
    const m = s.monthly[curMonth - 1];
    const tc = m.totalInterest + s.pointCost + (m.totalPMI || 0);
    return (!best || tc < best.tc) ? { ...s, tc: tc } : best;
  }, null);

  const trackRef = React.useRef(null);
  const handleScrub = React.useCallback(cx => {
    if (!trackRef.current) return;
    const r = trackRef.current.getBoundingClientRect();
    setSelectedMonth(Math.round(Math.max(0, Math.min(1, (cx - r.left) / r.width)) * (totalMonths - 1)) + 1);
  }, [totalMonths]);
  const onScrubDown = React.useCallback(e => {
    e.preventDefault(); handleScrub(e.clientX);
    const mv = ev => handleScrub(ev.clientX);
    const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
  }, [handleScrub]);
  const scrubPct = ((curMonth - 1) / (totalMonths - 1)) * 100;

  /* REPORT */
  if (showReport) {
    const rIsEn = reportLang === "en";
    const bestPts = bestAtMonth ? bestAtMonth.points : 0;
    const bestS = scenarios.find(s => s.points === bestPts);
    const noS = scenarios.find(s => s.points === 0) || scenarios[0];
    const genText = () => {
      const L = [];
      L.push(rIsEn ? "DISCOUNT POINTS ANALYSIS" : "\u6298\u6263\u70B9\u6570\u5206\u6790");
      L.push("");
      L.push((rIsEn ? "Loan: " : "\u8D37\u6B3E\u989D\uFF1A") + fmtD(loanAmount) + " | " + (rIsEn ? "Term: " : "\u671F\u9650\uFF1A") + termYears + (rIsEn ? "yr" : "\u5E74") + " | " + (rIsEn ? "Hold: " : "\u6301\u6709\uFF1A") + holdLabel);
      if (pmiApplies) {
        L.push((rIsEn ? "PMI: " : "PMI: ") + pmiRateAnnual + "%/yr (LTV " + initLTV.toFixed(1) + "%, FICO " + creditScore + "+) = " + fmtD(Math.round(loanAmount*pmiRateAnnual/100/12)) + "/mo");
      }
      L.push("");
      scenarios.forEach(s => {
        const m = s.monthly[curMonth - 1];
        const tc = m.totalInterest + s.pointCost + (m.totalPMI || 0);
        const best = bestAtMonth && tc <= bestAtMonth.tc + 1;
        const be = s.breakEvenYears ? (s.breakEvenYears + (rIsEn ? "yr" : "\u5E74")) : "N/A";
        const pmiStr = pmiApplies ? (" | PMI off " + s.pmiOffYears + (rIsEn?"yr":"\u5E74") + " ($"+fmt(Math.round(m.totalPMI||0))+" paid)") : "";
        L.push((best ? "\u2605 " : "\u25BA ") + fmtP(s.noteRate) + " / " + s.points + (rIsEn ? "pt" : "\u70B9") + ": " + fmtD(s.payment) + "/mo | APR " + fmtP(s.apr) + " | B/E " + be + pmiStr + " | " + (rIsEn ? "Total " : "\u603B") + fmtD(tc) + (best ? (rIsEn ? " \u2190 BEST" : " \u2190 \u6700\u4F18") : ""));
      });
      L.push("");
      L.push(rIsEn ? "Disclaimer: For informational purposes only." : "\u58F0\u660E\uFF1A\u4EC5\u4F9B\u53C2\u8003\u3002");
      return L.join("\n");
    };
    const txt = genText();
    return (
      <div style={{ fontFamily: FONT, background: C.white, minHeight: "100vh", color: C.text, maxWidth: 480, margin: "0 auto", padding: "14px 16px" }}>
        <GlobalStyles />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={{ display: "flex", background: C.cardAlt, borderRadius: 8, padding: 2 }}>
            {[{k:"cn",l:"\u4E2D\u6587"},{k:"en",l:"EN"}].map(t => {
              const a = t.k === reportLang;
              return <button key={t.k} onClick={() => setReportLang(t.k)} style={{ padding:"4px 12px", borderRadius:6, border:"none", cursor:"pointer", background:a ? C.fixed : "transparent", color:a ? C.white : C.textDim, fontSize:11, fontWeight:a ? 700 : 500, fontFamily:FONT }}>{t.l}</button>;
            })}
          </div>
          <button onClick={() => setShowReport(false)} style={{ background:"none", border:"1px solid "+C.border, borderRadius:6, padding:"3px 10px", cursor:"pointer", fontSize:11, color:C.textDim }}>{"\u2715"}</button>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
          <LogoSVG size={28} />
          <div>
            <div style={{ fontSize:15, fontWeight:700 }}>{rIsEn ? "Points Comparison Report" : "买点方案对比报告"}</div>
            <div style={{ fontSize:9, color:C.textMuted }}>Rate Navigator by JMJ</div>
          </div>
        </div>
        <div style={{ height:1.5, background:"linear-gradient(90deg,"+C.arm+","+C.fixed+")", borderRadius:1, marginBottom:10 }} />
        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:9, marginBottom:8 }}>
          <thead><tr style={{ background:C.cardAlt }}>
            {(rIsEn ? (pmiApplies ? ["Option","Rate","APR","Pmt","PMI","Cost","B/E","Total"] : ["Option","Rate","APR","Pmt","Save","Cost","B/E","Total"]) : (pmiApplies ? ["方案","利率","APR","月供","PMI","费用","回本","总成本"] : ["方案","利率","APR","月供","月省","费用","回本","总成本"])).map(h =>
              <th key={h} style={{ padding:"5px 3px", textAlign:"right", fontWeight:600, color:C.textDim, borderBottom:"1px solid "+C.border, fontSize:8 }}>{h}</th>
            )}
          </tr></thead>
          <tbody>{scenarios.map((s, i) => {
            const m = s.monthly[curMonth - 1];
            const tc = m.totalInterest + s.pointCost + (m.totalPMI || 0);
            const best = bestAtMonth && tc <= bestAtMonth.tc + 1;
            return (
              <tr key={i} style={{ background: best ? C.fixedLight : "transparent" }}>
                <td style={{ padding:"5px 3px", textAlign:"right", fontWeight:700, color:s.color, fontFamily:MONO, fontSize:8 }}>{s.label}</td>
                <td style={{ padding:"5px 3px", textAlign:"right", fontFamily:MONO }}>{fmtP(s.noteRate)}</td>
                <td style={{ padding:"5px 3px", textAlign:"right", fontFamily:MONO }}>{fmtP(s.apr)}</td>
                <td style={{ padding:"5px 3px", textAlign:"right", fontFamily:MONO }}>{fmtD(s.payment)}</td>
                {pmiApplies ? <td style={{ padding:"5px 3px", textAlign:"right", fontFamily:MONO, color:C.warn, fontSize:8 }}>{fmtD(Math.round(m.totalPMI||0))}<br/><span style={{ fontSize:7, color:C.textMuted }}>{s.pmiOffYears}{rIsEn?"y":"\u5E74"}</span></td> : <td style={{ padding:"5px 3px", textAlign:"right", fontFamily:MONO, color:s.monthlySaving > 0 ? C.arm : C.textMuted }}>{s.points === 0 ? "\u2014" : fmtD(s.monthlySaving)}</td>}
                <td style={{ padding:"5px 3px", textAlign:"right", fontFamily:MONO }}>{s.pointCost > 0 ? fmtD(s.pointCost) : "\u2014"}</td>
                <td style={{ padding:"5px 3px", textAlign:"right", fontFamily:MONO, color:s.breakEvenMonths && curMonth >= s.breakEvenMonths ? C.arm : C.textDim }}>{!s.breakEvenMonths ? "\u2014" : s.breakEvenYears + (rIsEn ? "yr" : "\u5E74")}</td>
                <td style={{ padding:"5px 3px", textAlign:"right", fontFamily:MONO, fontWeight:600, color:best ? C.fixed : C.text }}>{fmtD(tc)}</td>
              </tr>
            );
          })}</tbody>
        </table>
        <div style={{ marginTop:8, borderTop:"1px solid "+C.border, paddingTop:8 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
            <div style={{ fontSize:10, fontWeight:700 }}>{rIsEn ? "\u{1F4E7} Analysis" : "\u{1F4E7} \u5206\u6790\u6458\u8981"}</div>
            <button onClick={() => navigator.clipboard && navigator.clipboard.writeText(txt)} style={{ padding:"3px 10px", borderRadius:6, border:"1px solid "+C.arm, cursor:"pointer", background:C.armLight, color:C.arm, fontSize:10, fontWeight:600, fontFamily:FONT }}>{rIsEn ? "Copy" : "\u590D\u5236"}</button>
          </div>
          <div style={{ padding:10, background:C.cardAlt, borderRadius:10, fontSize:10, color:C.textSec, lineHeight:1.7, whiteSpace:"pre-wrap", fontFamily:FONT, border:"1px solid "+C.borderLight, maxHeight:250, overflow:"auto" }}>{txt}</div>
        </div>
        <div style={{ marginTop:8, textAlign:"center", fontSize:8, color:C.textMuted }}>Product by JMJ. All rights reserved.</div>
      </div>
    );
  }

  /* MAIN VIEW */
  return (
    <div style={{ fontFamily:FONT, background:C.bg, minHeight:"100vh", color:C.text, maxWidth:480, margin:"0 auto", paddingTop:56, paddingBottom:32 }}>
      <GlobalStyles />
      <div style={{ position:"fixed", top:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, zIndex:100, background:"rgba(255,255,255,0.15)", backdropFilter:"blur(22px) saturate(1.4)", WebkitBackdropFilter:"blur(22px) saturate(1.4)", borderBottom:"1px solid rgba(255,255,255,0.3)", boxShadow:"0 1px 12px rgba(30,60,30,0.04)" }}>
        <div style={{ padding:"10px 16px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <button onClick={onBack} style={{ background:"none", border:"none", cursor:"pointer", fontSize:20, color:C.textDim }}>&#8249;</button>
            <LogoSVG size={28} />
            <div>
              <div style={{ fontSize:14, fontWeight:700 }}>{isEn ? "Points Comparison" : "买点方案对比"}</div>
              <div style={{ fontSize:9, color:C.textMuted }}>POINTS COMPARISON by JMJ</div>
            </div>
          </div>
          <div style={{ display:"flex", gap:4 }}>
            <button onClick={() => setShowReport(true)} style={{ background:C.fixed, border:"none", borderRadius:8, padding:"5px 10px", cursor:"pointer", fontSize:11, color:C.white, fontFamily:FONT, fontWeight:600 }}>📋 生成报告</button>
            <button onClick={() => { setRateOptions([{id:1,rate:7,points:0},{id:2,rate:6.75,points:0.5}]); setSelectedMonth(60); }} style={{ background:C.cardAlt, border:"1px solid "+C.border, borderRadius:8, padding:"5px 10px", cursor:"pointer", fontSize:11, color:C.textSec, fontFamily:FONT, fontWeight:600 }}>🔄 重新模拟</button>
          </div>
        </div>
      </div>

      {/* Loan Input */}
      <div style={{ padding:"10px 16px 0" }}>
        <div style={{ background:C.card, border:"1px solid "+C.borderLight, borderRadius:18, padding:20, boxShadow:C.shadow }}>
          <div style={{ fontSize:13, fontWeight:700, marginBottom:8 }}>{isEn?"Loan Amount":"贷款金额"}</div>
          <div style={{ display:"flex", gap:6, marginBottom:12, background:C.cardAlt, borderRadius:10, padding:3 }}>
            {[{k:"price",l:isEn?"By Home Price":"通过房价推算"},{k:"direct",l:isEn?"Direct Input":"直接输入金额"}].map(t => {
              const a = t.k === loanMode;
              return <button key={t.k} onClick={() => setLoanMode(t.k)} style={{ flex:1, padding:"6px 2px", borderRadius:8, border:"none", cursor:"pointer", background:a ? C.white : "transparent", boxShadow:a ? C.shadow : "none", fontFamily:FONT, fontSize:11, fontWeight:a ? 700 : 500, color:a ? C.fixed : C.textDim }}>{t.l}</button>;
            })}
          </div>
          {loanMode === "price" ? <>
            <AmountSlider label={isEn?"Home Price":"房价"} value={homePrice} onChange={setHomePrice} min={200000} max={3000000} step={25000} color={C.fixed} />
            <div style={{ marginBottom:12 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                <span style={{ fontSize:12, color:C.textSec, fontWeight:600 }}>{isEn?"Down Payment":"首付比例"}</span>
                <span style={{ fontSize:14, fontWeight:700, fontFamily:MONO, color:C.fixed }}>{downPct}% = {fmtD(homePrice * downPct / 100)}</span>
              </div>
              <input type="range" min={3} max={50} step={1} value={downPct} onChange={e => setDownPct(Number(e.target.value))}
                style={{ width:"100%", height:5, borderRadius:3, outline:"none", appearance:"none", WebkitAppearance:"none", cursor:"pointer", background:`linear-gradient(to right,${C.fixed} 0%,${C.fixed} ${((downPct-3)/47)*100}%,${C.border} ${((downPct-3)/47)*100}%,${C.border} 100%)` }} />
            </div>
            <div style={{ padding:"8px 12px", background:C.fixedLight, borderRadius:10, fontSize:12, fontWeight:600, color:C.fixed, textAlign:"center" }}>{isEn?"Loan Amount":"贷款金额"}: {fmtD(loanAmount)}</div>
          </> : <AmountSlider label={isEn?"Loan Amount":"贷款金额"} value={directLoan} onChange={setDirectLoan} min={100000} max={2000000} step={25000} color={C.fixed} />}
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:12, color:C.textSec, fontWeight:600, marginBottom:6 }}>{isEn ? "Loan Term" : "\u8D37\u6B3E\u671F\u9650"}</div>
            <div style={{ display:"flex", gap:6, background:C.cardAlt, borderRadius:12, padding:3 }}>
              {[15,20,25,30].map(y => {
                const a = y === termYears;
                return <button key={y} onClick={() => setTermYears(y)} style={{ flex:1, padding:"8px 2px", borderRadius:10, border:"none", cursor:"pointer", background:a ? C.white : "transparent", boxShadow:a ? C.shadow : "none", fontFamily:FONT, fontSize:13, fontWeight:a ? 700 : 500, color:a ? C.fixed : C.textDim }}>{y}{isEn ? "yr" : "\u5E74"}</button>;
              })}
            </div>
          </div>
          {/* PMI Section - only shows when LTV > 80% */}
          {pmiApplies && <div style={{ marginBottom:14, padding:"10px 12px", background:C.warnLight, borderRadius:12, border:"1px solid "+C.warn+"25" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
              <div style={{ fontSize:12, fontWeight:700, color:C.warn }}>{isEn?"\u26A0 PMI Required":"\u26A0 需缴PMI"} <span style={{ fontSize:10, color:C.textMuted, fontWeight:500 }}>(LTV {initLTV.toFixed(1)}%)</span></div>
              <div style={{ fontSize:11, fontWeight:700, fontFamily:MONO, color:C.warn }}>{pmiRateAnnual}% /yr</div>
            </div>
            <div style={{ fontSize:10, color:C.textSec, fontWeight:600, marginBottom:4 }}>{isEn?"Credit Score (FICO)":"信用评分 (FICO)"}</div>
            <select value={creditScore} onChange={e => setCreditScore(e.target.value)} style={{ width:"100%", padding:"6px 4px", borderRadius:8, border:"1px solid "+C.border, fontSize:11, fontFamily:FONT, background:C.white, outline:"none" }}>
              <option value="760">760+ ({isEn?"Excellent":"优秀"})</option>
              <option value="740">740-759 ({isEn?"Very Good":"很好"})</option>
              <option value="720">720-739 ({isEn?"Good":"良好"})</option>
              <option value="700">700-719 ({isEn?"Above Avg":"中上"})</option>
              <option value="680">680-699 ({isEn?"Average":"一般"})</option>
              <option value="660">660-679 ({isEn?"Fair":"中下"})</option>
              <option value="640">640-659 ({isEn?"Below Avg":"偏低"})</option>
              <option value="620">620-639 ({isEn?"Poor":"较差"})</option>
            </select>
            <div style={{ fontSize:9, color:C.textMuted, marginTop:6, lineHeight:1.4 }}>{isEn?`Monthly PMI ~${fmtD(Math.round(loanAmount*pmiRateAnnual/100/12))}. Auto-cancels at 78% LTV (balance \u2264 ${fmtD(pmiCancelBalance)}).`:`PMI月费约${fmtD(Math.round(loanAmount*pmiRateAnnual/100/12))}。LTV降至78%（余额\u2264${fmtD(pmiCancelBalance)}）自动取消。`}</div>
          </div>}
          <div style={{ marginBottom:16 }}></div>

          {/* Rate Options */}
          <div style={{ fontSize:13, color:C.text, fontWeight:600, marginBottom:8 }}>{isEn ? "Rate Options" : "\u5229\u7387\u65B9\u6848"} <span style={{ fontSize:10, color:C.textMuted }}>{isEn ? "2-7 options" : "2-7\u4E2A\u65B9\u6848"}</span></div>
          {minWarn && <div style={{ padding:"8px 12px", marginBottom:8, borderRadius:10, background:C.warnLight, border:"1px solid "+C.warn+"30", fontSize:12, color:C.warn, fontWeight:600 }}>{isEn ? "At least 2 options needed" : "\u81F3\u5C11\u9700\u89812\u4E2A\u65B9\u6848"}</div>}
          {rateOptions.map((opt, idx) => (
            <div key={opt.id} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:6, padding:"8px 10px", background:idx === 0 ? C.dangerLight : C.fixedLight, borderRadius:12 }}>
              <div style={{ width:6, height:6, borderRadius:"50%", background:idx === 0 ? C.danger : PT_COLORS[idx % PT_COLORS.length] }} />
              <div style={{ flex:1, display:"flex", gap:6, alignItems:"center" }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:9, color:C.textMuted, marginBottom:2 }}>{isEn ? "Rate" : "\u5229\u7387"}</div>
                  <input type="number" key={"r"+opt.id} defaultValue={opt.rate} step="0.001" min="1" max="15"
                    onChange={e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v > 0 && v <= 15) updateOption(opt.id, "rate", Math.round(v * 1000) / 1000); }}
                    onBlur={e => { const v = parseFloat(e.target.value); if (isNaN(v) || v <= 0) e.target.value = opt.rate; }}
                    style={{ width:"100%", padding:"5px 6px", borderRadius:6, border:"1px solid "+C.border, fontSize:13, fontFamily:MONO, fontWeight:700, color:C.text, outline:"none", background:C.white, textAlign:"center" }} />
                </div>
                <div style={{ fontSize:14, color:C.textMuted }}>/</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:9, color:C.textMuted, marginBottom:2 }}>{isEn ? "Points" : "\u70B9\u6570"}</div>
                  <input type="number" key={"p"+opt.id} defaultValue={opt.points} step="0.125" min="0" max="5"
                    onChange={e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0 && v <= 5) updateOption(opt.id, "points", Math.round(v * 1000) / 1000); }}
                    onBlur={e => { const v = parseFloat(e.target.value); if (isNaN(v) || v < 0) e.target.value = opt.points; }}
                    style={{ width:"100%", padding:"5px 6px", borderRadius:6, border:"1px solid "+C.border, fontSize:13, fontFamily:MONO, fontWeight:700, color:C.text, outline:"none", background:C.white, textAlign:"center" }} />
                </div>
              </div>
              <button onClick={() => removeOption(opt.id)} style={{ background:"none", border:"none", cursor:"pointer", fontSize:16, color:C.textMuted, padding:"0 4px" }}>{"\u2715"}</button>
            </div>
          ))}
          {rateOptions.length < 7 && <button onClick={addOption} style={{ width:"100%", padding:10, borderRadius:12, border:"1.5px dashed "+C.fixed+"40", background:"transparent", cursor:"pointer", fontSize:13, fontWeight:600, color:C.fixed, fontFamily:FONT }}>+ {isEn ? "Add Option" : "\u6DFB\u52A0\u65B9\u6848"}</button>}
        </div>
      </div>

      {/* Timeline */}
      <div style={{ padding:"10px 16px 0" }}>
        <div style={{ background:C.card, border:"1px solid "+C.borderLight, borderRadius:18, padding:"14px 18px", boxShadow:C.shadow }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ fontSize:11, color:C.textDim, fontWeight:600 }}>{isEn ? "HOLDING PERIOD" : "\u6301\u6709\u65F6\u95F4"}</span>
            <div style={{ padding:"5px 12px", borderRadius:20, background:C.fixedLight }}><span style={{ fontSize:13, fontWeight:700, color:C.fixed, fontFamily:MONO }}>{holdLabel}</span></div>
          </div>
          <div ref={trackRef} onPointerDown={onScrubDown} style={{ position:"relative", height:44, cursor:"pointer", touchAction:"none", userSelect:"none" }}>
            <div style={{ position:"absolute", top:18, left:0, right:0, height:8, borderRadius:4, background:C.border }} />
            <div style={{ position:"absolute", top:18, left:0, width:scrubPct+"%", height:8, borderRadius:4, background:C.fixed }} />
            <div style={{ position:"absolute", top:10, left:scrubPct+"%", transform:"translateX(-50%)", width:24, height:24, borderRadius:"50%", background:C.white, border:"3px solid "+C.fixed, boxShadow:"0 2px 10px "+C.fixed+"35" }} />
          </div>
        </div>
      </div>

      {/* Comparison Table */}
      <div style={{ padding:"8px 16px 0" }}>
        <div style={{ background:C.card, border:"1px solid "+C.borderLight, borderRadius:18, padding:18, boxShadow:C.shadow }}>
          <div style={{ fontSize:13, fontWeight:700, marginBottom:14 }}>{isEn ? "Comparison" : "\u65B9\u6848\u5BF9\u6BD4"} <span style={{ fontSize:10, color:C.textMuted, fontWeight:400 }}>{holdLabel}</span></div>
          {scenarios.map((s, i) => {
            const m = s.monthly[curMonth - 1];
            const tc = m.totalInterest + s.pointCost + (m.totalPMI || 0);
            const best = bestAtMonth && tc <= bestAtMonth.tc + 1;
            const totalMoPmt = s.payment + (m.pmiActive ? s.monthlyPMI : 0);
            return (
              <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:"1px solid "+C.borderLight }}>
                <div>
                  <div style={{ fontSize:12, fontWeight:700, color:s.color, fontFamily:MONO }}>{s.label}</div>
                  <div style={{ fontSize:10, color:C.textMuted }}>{fmtD(totalMoPmt)}/mo {pmiApplies && m.pmiActive ? ("(P&I "+fmtD(s.payment)+"+PMI "+fmtD(s.monthlyPMI)+")") : (s.monthlySaving > 0 ? ("(" + (isEn ? "save " : "\u7701") + fmtD(s.monthlySaving) + ")") : "")}</div>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontSize:14, fontWeight:700, color:best ? C.fixed : C.text, fontFamily:MONO }}>{fmtD(tc)}</div>
                  <div style={{ fontSize:9, color:C.textDim }}>{s.breakEvenYears ? ("B/E " + s.breakEvenYears + (isEn ? "yr" : "\u5E74")) : ""}{pmiApplies && s.pmiOffYears ? (" \u00B7 PMI off "+s.pmiOffYears+(isEn?"yr":"\u5E74")) : ""}{best ? (isEn ? " \u2B50 BEST" : " \u2B50 \u6700\u4F18") : ""}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ padding:"8px 16px 0" }}><GlossarySection terms={POINTS_GLOSSARY} en={isEn} /></div>
      <BrandingFooter />
    </div>
  );
}


const REFI_GLOSSARY = [
  { term:"Refinance", cn:"再融资/转贷", desc:"用新贷款替换现有贷款，通常为了获得更低利率、降低月供或改变贷款期限。", descEn:"Replacing your current mortgage with a new one, typically to get a lower rate, reduce monthly payment, or change loan term." },
  { term:"CEMA", cn:"贷款合并修改协议", desc:"纽约州特有的Consolidation Extension Modification Agreement。做CEMA可以只对「新增贷款金额」（新贷款-旧余额）缴纳抵押贷款税，大幅节省closing cost。", descEn:"NY-specific Consolidation Extension Modification Agreement. With CEMA, mortgage tax is only paid on the 'new money' (new loan minus existing balance), significantly reducing closing costs." },
  { term:"Mortgage Tax", cn:"抵押贷款记录税", desc:"纽约州在记录新贷款时征收的税。NYC约1.8-1.925%，纽约州其他地区约0.5%。不做CEMA则对全部贷款额征收。", descEn:"Tax levied by NY State when recording a new mortgage. NYC: ~1.8-1.925%, rest of NY: ~0.5%. Without CEMA, tax applies to the full loan amount." },
  { term:"Closing Cost", cn:"过户/结算费用", desc:"完成再融资所需的各项费用总和，包括银行费用、第三方费用和政府税费。不包括escrow和prepaid。", descEn:"Total fees to complete a refinance, including lender fees, third-party fees, and government taxes. Excludes escrow and prepaids." },
  { term:"Break-Even", cn:"回本时间", desc:"通过月供节省收回closing cost所需的时间。如果计划在此之前卖房，refi可能不划算。", descEn:"Time needed for monthly savings to recoup total closing costs. If you sell before break-even, the refinance may not be worthwhile." },
];

function RefiAnalyzer({ onBack, lang }) {
  const isEn = lang === "en";
  // Current loan
  const [refiMode, setRefiMode] = React.useState("direct");
  const [refiHomeVal, setRefiHomeVal] = React.useState(600000);
  const [refiOwedPct, setRefiOwedPct] = React.useState(75);
  const [curRate, setCurRate] = React.useState(7.125);
  const [curBalance, setCurBalance] = React.useState(450000);
  const refiLoan = refiMode === "home" ? Math.round(refiHomeVal * refiOwedPct / 100) : curBalance;
  const [curRemainYears, setCurRemainYears] = React.useState(28);
  // New loan
  const [newRate, setNewRate] = React.useState(6.500);
  const [newTerm, setNewTerm] = React.useState(30);
  const [newPoints, setNewPoints] = React.useState(0);
  // Closing costs
  const [processingFee, setProcessingFee] = React.useState(1500);
  const [underwritingFee, setUnderwritingFee] = React.useState(900);
  const [creditReport, setCreditReport] = React.useState(50);
  const [attorney, setAttorney] = React.useState(1500);
  const [titleIns, setTitleIns] = React.useState(2000);
  const [govRecording, setGovRecording] = React.useState(500);
  // NY Mortgage Tax
  const [taxArea, setTaxArea] = React.useState("nyc_high"); // "nyc_high"|"nyc_low"|"non_nyc"|"none"
  const [useCEMA, setUseCEMA] = React.useState(true);
  const [cemaFee, setCemaFee] = React.useState(2000);
  // UI
  const [showCosts, setShowCosts] = React.useState(false);
  const [showReport, setShowReport] = React.useState(false);
  const [reportLang, setReportLang] = React.useState(lang);
  const [holdMonth, setHoldMonth] = React.useState(60);

  const newLoanAmount = curBalance; // refi same balance
  const pointCost = newPoints * 0.01 * newLoanAmount;

  // Mortgage tax calc
  const taxRates = { nyc_high: 0.01925, nyc_low: 0.018, non_nyc: 0.005, none: 0 };
  const taxRate = taxRates[taxArea] || 0;
  const taxableAmount = useCEMA ? Math.max(0, newLoanAmount - curBalance) : newLoanAmount;
  // For pure refi (same balance), CEMA taxable = 0 if no cash-out
  const mortgageTax = Math.round(taxableAmount * taxRate);
  const cemaTotal = useCEMA ? cemaFee : 0;

  const totalClosing = processingFee + underwritingFee + creditReport + attorney + titleIns + govRecording + pointCost + mortgageTax + cemaTotal;

  // Payments
  const curPayment = pmtCalc(curRate, curRemainYears * 12, curBalance);
  const newPayment = pmtCalc(newRate, newTerm * 12, newLoanAmount);
  const monthlySaving = curPayment - newPayment;
  const breakEvenMonths = monthlySaving > 0 ? Math.ceil(totalClosing / monthlySaving) : null;
  const breakEvenYears = breakEvenMonths ? (breakEvenMonths / 12).toFixed(1) : null;
  const newAPR = calcAPR(newRate, newLoanAmount, pointCost + processingFee + underwritingFee, newTerm * 12);

  // Net savings at holding period
  const holdYrs = holdMonth / 12;
  const holdLabel = holdYrs % 1 === 0 ? `${holdYrs}${isEn?"yr":"年"}` : `${holdYrs.toFixed(1)}${isEn?"yr":"年"}`;
  const netSavings = monthlySaving * holdMonth - totalClosing;
  const worthIt = monthlySaving > 0 && (breakEvenMonths ? holdMonth >= breakEvenMonths : false);

  // Total interest comparison
  const curTotalInt = React.useMemo(() => { let b=curBalance,ti=0; const mp=curPayment; for(let m=0;m<curRemainYears*12;m++){const ip=b*(curRate/100/12);b=Math.max(0,b-(mp-ip));ti+=ip;} return ti; }, [curBalance,curRate,curRemainYears,curPayment]);
  const newTotalInt = React.useMemo(() => { let b=newLoanAmount,ti=0; const mp=newPayment; for(let m=0;m<newTerm*12;m++){const ip=b*(newRate/100/12);b=Math.max(0,b-(mp-ip));ti+=ip;} return ti; }, [newLoanAmount,newRate,newTerm,newPayment]);

  const scrubRef = React.useRef(null);
  const maxHold = newTerm * 12;
  const handleScrub = React.useCallback(cx => { if(!scrubRef.current) return; const r=scrubRef.current.getBoundingClientRect(); setHoldMonth(Math.max(1,Math.round(Math.max(0,Math.min(1,(cx-r.left)/r.width))*(maxHold-1))+1)); }, [maxHold]);
  const onScrubDown = React.useCallback(e => { e.preventDefault(); handleScrub(e.clientX); const mv=ev=>handleScrub(ev.clientX); const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);}; window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); }, [handleScrub]);

  // Insight
  const getInsight = () => {
    if (monthlySaving <= 0) return { icon:"⚠️", color:C.danger, bg:C.dangerLight, title:isEn?"New rate does not reduce payment":"新利率未降低月供", desc:isEn?"New loan payment is not lower than current. Refinance is not economically beneficial.":"新贷款月供不低于现有贷款，Refinance在经济上不划算。" };
    if (!breakEvenMonths) return { icon:"⏳", color:C.warn, bg:C.warnLight, title:isEn?"Break-even too long":"回本时间过长", desc:isEn?"Monthly savings cannot recoup closing costs in a reasonable timeframe.":"月供节省无法在合理时间内收回closing cost。" };
    if (worthIt) return { icon:"✅", color:C.arm, bg:C.armLight, title:`${isEn?"Refi worth it · B/E "+breakEvenYears+"yr":"Refi划算 · 回本"+breakEvenYears+"年"}`, desc:isEn?`Net savings ${fmtD(netSavings)} over ${holdLabel}. Save ${fmtD(monthlySaving)}/mo, break-even at ${breakEvenYears}yr.`:`持有${holdLabel}可净省${fmtD(netSavings)}。每月省${fmtD(monthlySaving)}，${breakEvenYears}年回本后持续受益。` };
    return { icon:"⏳", color:C.warn, bg:C.warnLight, title:`${isEn?"Hold >"+breakEvenYears+"yr needed":"需持有超过"+breakEvenYears+"年"}`, desc:`${isEn?"Break-even at "+breakEvenYears+"yr. Hold "+holdLabel+", costs not recouped":"回本需"+breakEvenYears+"年。当前持有"+holdLabel+"，Closing cost尚未收回"}，${isEn?(netSavings>=0?"Net Save":"Net Loss"):(netSavings>=0?"净省":"净亏")}${fmtD(Math.abs(netSavings))}。` };
  };
  const insight = getInsight();

  const CostRow = ({label,value,onChange}) => (
    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderBottom:`1px solid ${C.borderLight}` }}>
      <span style={{ fontSize:12, color:C.textSec }}>{label}</span>
      <input type="number" key={value} defaultValue={value}
        onChange={e=>{const v=parseInt(e.target.value);if(!isNaN(v)&&v>=0)onChange(v);}}
        onBlur={e=>{if(!e.target.value)e.target.value=value;}}
        style={{ width:80, padding:"4px 6px", borderRadius:6, border:`1px solid ${C.border}`, fontSize:12, fontFamily:MONO, textAlign:"right", outline:"none", background:C.white }} />
    </div>
  );

  /* Report */
  if (showReport) {
    const isEn = reportLang === "en";
    const genText = () => {
      const L = [];
      L.push(isEn? "REFINANCE ANALYSIS" : "再融资分析报告");
      L.push("");
      L.push(isEn? `Current: ${fmtP(curRate)} | Balance ${fmtD(curBalance)} | ${curRemainYears}yr remaining | Payment ${fmtD(curPayment)}/mo` : `现有贷款：${fmtP(curRate)} | 余额${fmtD(curBalance)} | 剩余${curRemainYears}${isEn?"yr":"年"} | 月供${fmtD(curPayment)}`);
      L.push(isEn? `New: ${fmtP(newRate)} | ${newTerm}yr | ${newPoints}pt | Payment ${fmtD(newPayment)}/mo | APR ${fmtP(newAPR)}` : `新贷款：${fmtP(newRate)} | ${newTerm}年 | ${newPoints}点 | 月供${fmtD(newPayment)} | APR ${fmtP(newAPR)}`);
      L.push("");
      L.push(isEn? `Monthly Savings: ${fmtD(monthlySaving)}` : `月供节省：${fmtD(monthlySaving)}`);
      L.push(isEn? `Total Closing Cost: ${fmtD(totalClosing)}` : `总Closing Cost：${fmtD(totalClosing)}`);
      if (taxArea !== "none") L.push(isEn? `  Mortgage Tax: ${fmtD(mortgageTax)}${useCEMA?" (CEMA)":""}` : `  抵押税：${fmtD(mortgageTax)}${useCEMA?"（CEMA）":""}`);
      L.push(isEn? `Break-Even: ${breakEvenYears ? breakEvenYears+"yr" : "N/A"}` : `回本时间：${breakEvenYears ? breakEvenYears+"年" : "—"}`);
      L.push(isEn? `Net Savings (${holdLabel}): ${fmtD(netSavings)}` : `净节省（持有${holdLabel}）：${fmtD(netSavings)}`);
      L.push("");
      L.push(isEn? "RECOMMENDATION:" : "建议：");
      L.push(isEn? insight.desc.replace(/[^\x00-\x7F]/g,"") : insight.desc);
      if (isEn && insight.desc.includes("划算")) L.push(`Refinancing is recommended. Monthly savings of ${fmtD(monthlySaving)} with a break-even at ${breakEvenYears} years. Net savings of ${fmtD(netSavings)} over ${holdLabel.replace("年","yr")}.`);
      else if (isEn) L.push(`${monthlySaving > 0 ? `Monthly savings would be ${fmtD(monthlySaving)}, but closing costs of ${fmtD(totalClosing)} require ${breakEvenYears || "N/A"} years to recoup.` : "The new rate does not reduce monthly payments."}`);
      L.push("");
      L.push(isEn? "Disclaimer: For informational purposes only." : "声明：本分析仅供参考。");
      return L.join("\n");
    };
    const txt = genText();
    return (
      <div style={{ fontFamily:FONT, background:C.white, minHeight:"100vh", color:C.text, maxWidth:480, margin:"0 auto", WebkitFontSmoothing:"antialiased" }}>
        <GlobalStyles />
        <div style={{ padding:"14px 16px 16px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <div style={{ display:"flex", gap:0, background:C.cardAlt, borderRadius:8, padding:2 }}>
              {[{k:"cn",l:"中文"},{k:"en",l:"EN"}].map(t=>{const a=t.k===reportLang;return <button key={t.k} onClick={()=>setReportLang(t.k)} style={{ padding:"4px 12px", borderRadius:6, border:"none", cursor:"pointer", background:a?C.purple:"transparent", color:a?C.white:C.textDim, fontSize:11, fontWeight:a?700:500, fontFamily:FONT }}>{t.l}</button>;})}
            </div>
            <button onClick={()=>setShowReport(false)} style={{ background:"none", border:`1px solid ${C.border}`, borderRadius:6, padding:"3px 10px", cursor:"pointer", fontSize:11, color:C.textDim, fontFamily:FONT }}>✕</button>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
            <LogoSVG size={28} />
            <div><div style={{ fontSize:15, fontWeight:700 }}>{isEn?"Refinance Analysis Report":"再融资分析报告"}</div><div style={{ fontSize:9, color:C.textMuted }}>Rate Navigator by JMJ · {new Date().toLocaleDateString(isEn?"en-US":"zh-CN")}</div></div>
          </div>
          <div style={{ height:1.5, background:`linear-gradient(90deg,${C.purple},${C.arm})`, borderRadius:1, marginBottom:10 }} />
          {/* Key metrics */}
          <div style={{ display:"flex", gap:4, marginBottom:8, flexWrap:"wrap" }}>
            {[{l:isEn?"Current":"现有",v:`${fmtP(curRate)} · ${fmtD(curPayment)}/mo`},{l:isEn?"New":"新",v:`${fmtP(newRate)} · ${fmtD(newPayment)}/mo`},{l:"APR",v:fmtP(newAPR)},{l:isEn?"Saving":"月省",v:fmtD(monthlySaving)},{l:isEn?"Closing":"费用",v:fmtD(totalClosing)},{l:isEn?"B/E":"回本",v:breakEvenYears?(breakEvenYears+(isEn?"yr":"年")):"—"},{l:isEn?"Net":"净省",v:fmtD(netSavings)}].map(x=>
              <div key={x.l} style={{ flex:1, minWidth:55, padding:"5px 4px", background:C.cardAlt, borderRadius:8, textAlign:"center" }}>
                <div style={{ fontSize:7, color:C.textDim }}>{x.l}</div><div style={{ fontSize:10, fontWeight:700, fontFamily:MONO, color:C.text }}>{x.v}</div>
              </div>
            )}
          </div>
          <div style={{ padding:"10px 12px", borderRadius:12, background:insight.bg, border:`1px solid ${insight.color}20`, marginBottom:8 }}>
            <div style={{ fontSize:13, fontWeight:700, color:insight.color }}>{insight.icon} {isEn?(worthIt?"Refinance recommended":"Refinance may not be optimal"):insight.title}</div>
          </div>
          {/* Analysis text */}
          <div style={{ marginTop:8, borderTop:`1px solid ${C.border}`, paddingTop:8 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
              <div style={{ fontSize:10, fontWeight:700 }}>{isEn?"📧 Analysis":"📧 分析摘要"}</div>
              <button onClick={()=>navigator.clipboard?.writeText(txt)} style={{ padding:"3px 10px", borderRadius:6, border:`1px solid ${C.purple}`, cursor:"pointer", background:C.purpleLight, color:C.purple, fontSize:10, fontWeight:600, fontFamily:FONT }}>{isEn?"Copy":"复制"}</button>
            </div>
            <div style={{ padding:10, background:C.cardAlt, borderRadius:10, fontSize:10, color:C.textSec, lineHeight:1.7, whiteSpace:"pre-wrap", fontFamily:FONT, border:`1px solid ${C.borderLight}`, maxHeight:250, overflow:"auto" }}>{txt}</div>
          </div>
          <div style={{ marginTop:8, textAlign:"center", fontSize:8, color:C.textMuted }}>Product by JMJ. All rights reserved.</div>
        </div>
      </div>
    );
  }

  /* Main UI */
  return (
